services:
  billing-service:
    build: .
    ports:
      - "5011:8080"
    environment:
      - ConnectionStrings__BillingDatabase=Host=postgres;Port=5432;Database=BillingServiceDb;Username=billing;Password=${POSTGRES_PASSWORD:-Billing123!}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__User=guest
      - RabbitMQ__Password=guest
      - Messaging__UseStub=false
      - MercadoPago__UseStub=true
      - MercadoPago__NotificationUrl=http://billing-service:8080/api/payment/webhook
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=BillingServiceDb
      - POSTGRES_USER=billing
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Billing123!}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d BillingServiceDb"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
