apiVersion: v1
kind: Namespace
metadata:
  name: autorepair
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: autorepair
  labels:
    app: billing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
        tags.datadoghq.com/env: lab
        tags.datadoghq.com/service: billing-service
        tags.datadoghq.com/version: "1.0.0"
      annotations:
        ad.datadoghq.com/billing-service.logs: '[{"source":"csharp","service":"billing-service","env":"lab"}]'
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: billing-service
          image: ghcr.io/autorepairorg/billing-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: Messaging__UseStub
              value: "false"
            - name: MercadoPago__UseStub
              value: "true"
            - name: ConnectionStrings__BillingDatabase
              value: "Host=127.0.0.1;Port=5432;Database=BillingServiceDb;Username=billing;Password=Billing123!"
            - name: RabbitMQ__Host
              valueFrom:
                configMapKeyRef:
                  name: billing-service-config
                  key: rabbitmq-host
            - name: RabbitMQ__Port
              valueFrom:
                configMapKeyRef:
                  name: billing-service-config
                  key: rabbitmq-port
            - name: RabbitMQ__User
              valueFrom:
                configMapKeyRef:
                  name: billing-service-config
                  key: rabbitmq-user
            - name: RabbitMQ__Password
              valueFrom:
                configMapKeyRef:
                  name: billing-service-config
                  key: rabbitmq-password
            - name: MercadoPago__NotificationUrl
              valueFrom:
                configMapKeyRef:
                  name: billing-service-config
                  key: mp-notification-url
            - name: DD_SERVICE
              value: "billing-service"
            - name: DD_ENV
              value: "lab"
            - name: DD_VERSION
              value: "1.0.0"
            - name: DD_SITE
              value: "datadoghq.com"
            - name: DD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: datadog-secret
                  key: api-key
                  optional: true
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: BillingServiceDb
            - name: POSTGRES_USER
              value: billing
            - name: POSTGRES_PASSWORD
              value: "Billing123!"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "billing", "-d", "BillingServiceDb"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: autorepair
spec:
  selector:
    app: billing-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: billing-service-hpa
  namespace: autorepair
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: billing-service
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  namespace: autorepair
data:
  rabbitmq-host: "rabbitmq-service"
  rabbitmq-port: "5672"
  rabbitmq-user: "autorepair"
  rabbitmq-password: "autorepair"
  mp-notification-url: "https://api.autorepair.local/api/payment/webhook"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: autorepair
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "autorepair"
            - name: RABBITMQ_DEFAULT_PASS
              value: "autorepair"
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: autorepair
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  type: ClusterIP
